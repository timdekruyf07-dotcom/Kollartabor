# ==========================================
# KOLLER & TABOR INSTALLATIETECHNIEK
# SVELTIA CMS CONFIGURATIE
# ==========================================


# ==========================================
# GITHUB & INLOGGEN
# ==========================================

backend:
  name: github
  repo: timdekruyf07-dotcom/Kollartabor
  branch: main
  auth_methods:
    - token


# ==========================================
# TAAL
# ==========================================

locale: nl


# ==========================================
# AFBEELDINGEN
# ==========================================

media_folder: "images/uploads"
public_folder: "images/uploads"


# ==========================================
# BEHEERONDERDELEN
# ==========================================

collections:


  # ========================================
  # PROJECTEN
  # ========================================

  - name: projecten
    label: Projecten

    files:

      - name: projectenpagina
        label: Projecten beheren
        file: content/projecten.json
        format: json

        fields:

          - label: Introductietekst bovenaan
            name: introduction
            widget: text
            hint: "Deze tekst verschijnt bovenaan de projectenpagina."

          - label: Projecten
            name: projects
            widget: list
            label_singular: Project
            summary: "{{fields.title}}"
            required: false
            default: []
            hint: "Voeg projecten toe, wijzig bestaande projecten of verwijder ze."

            fields:

              - label: Projectnaam
                name: title
                widget: string

              - label: Korte omschrijving
                name: summary
                widget: text

              - label: Uitgebreide beschrijving
                name: description
                widget: text
                required: false

              - label: Projectfoto
                name: image
                widget: image
                required: false
                hint: "Upload een foto van het project."

              - label: Beschrijving van de foto
                name: image_alt
                widget: string
                required: false

              - label: Locatie
                name: location
                widget: string
                required: false

              - label: Datum
                name: date
                widget: datetime
                type: date
                required: false

              - label: Volgorde
                name: order
                widget: number
                value_type: int
                required: false

              - label: Project zichtbaar op website
                name: published
                widget: boolean
                default: true


  # ========================================
  # ONS TEAM
  # ========================================

  - name: team
    label: Ons team

    files:

      - name: teampagina
        label: Team beheren
        file: content/team.json
        format: json

        fields:

          # Introductietekst bovenaan
          - label: Introductietekst bovenaan
            name: introduction
            widget: text
            hint: "Deze tekst verschijnt bovenaan de teampagina."


          # Titel boven de medewerkers
          - label: Titel boven de medewerkers
            name: section_title
            widget: string
            hint: "Bijvoorbeeld: De mensen achter Koller & Tabor"


          # Beschrijving boven de medewerkers
          - label: Beschrijving boven de medewerkers
            name: section_description
            widget: text
            hint: "Deze tekst staat naast de titel boven de medewerkers."


          # Medewerkers
          - label: Medewerkers
            name: members
            widget: list
            label_singular: Medewerker
            summary: "{{fields.name}}"
            required: false
            default: []
            hint: "Voeg medewerkers toe, wijzig ze of verwijder ze. Je kunt de volgorde zelf bepalen."

            fields:

              - label: Naam
                name: name
                widget: string
                hint: "Vul de naam van de medewerker in."

              - label: Functie
                name: role
                widget: string
                hint: "Bijvoorbeeld: Installatiemonteur"

              - label: Introductie
                name: description
                widget: text
                required: false
                hint: "Een korte beschrijving van de medewerker."

              - label: Profielfoto
                name: photo
                widget: image
                required: false
                hint: "Upload een profielfoto. Zonder foto verschijnt Foto volgt."

              - label: Beschrijving van de foto
                name: photo_alt
                widget: string
                required: false
                hint: "Beschrijf kort wat op de foto te zien is."

              - label: Volgorde
                name: order
                widget: number
                value_type: int
                required: false
                hint: "Bijvoorbeeld 1, 2 of 3."

              - label: Medewerker zichtbaar op website
                name: published
                widget: boolean
                default: true


  # ========================================
  # TARIEVEN
  # ========================================

  - name: tarieven
    label: Tarieven

    files:

      - name: tarievenpagina
        label: Tarievenpagina
        file: content/tarieven.json
        format: json

        fields:

          - label: Introductietekst
            name: introduction
            widget: text

          - label: Arbeidstarieven
            name: hourly_rates
            widget: list
            label_singular: Arbeidstarief
            summary: "{{fields.name}}"
            required: false
            default: []

            fields:

              - label: Tariefsoort
                name: name
                widget: string

              - label: Exclusief btw
                name: price_ex
                widget: string

              - label: Inclusief btw
                name: price_in
                widget: string


          - label: Toeslagen
            name: surcharges
            widget: list
            label_singular: Toeslag
            summary: "{{fields.period}}"
            required: false
            default: []

            fields:

              - label: Periode
                name: period
                widget: string

              - label: Percentage
                name: percentage
                widget: string


          - label: Voorrijkosten
            name: travel
            widget: object
            collapsed: true

            fields:

              - label: Binnen 25 kilometer
                name: within_25
                widget: string

              - label: Binnen 25 kilometer inclusief btw
                name: within_25_vat
                widget: string

              - label: Boven 25 kilometer
                name: beyond_25
                widget: string

              - label: Toelichting
                name: description
                widget: text


          - label: Uitgebreide toelichting
            name: explanations
            widget: list
            label_singular: Toelichting
            summary: "{{fields.title}}"
            required: false
            default: []

            fields:

              - label: Titel
                name: title
                widget: string

              - label: Inhoud
                name: content
                widget: text


          - label: Algemene voorwaarden consumenten
            name: consumer_terms
            widget: string

          - label: Algemene voorwaarden bedrijven
            name: business_terms
            widget: string


  # ========================================
  # CONTACT
  # ========================================

  - name: contact
    label: Contact

    files:

      - name: contactpagina
        label: Contactgegevens
        file: content/contact.json
        format: json

        fields:

          - label: Introductietekst
            name: introduction
            widget: text

          - label: Telefoonnummer
            name: phone
            widget: string

          - label: E-mailadres
            name: email
            widget: string

          - label: Straat en huisnummer
            name: address
            widget: string

          - label: Postcode
            name: postal_code
            widget: string

          - label: Plaats
            name: city
            widget: string

          - label: Website
            name: website
            widget: string
            required: false

          - label: Google Maps link
            name: maps
            widget: string
            required: false

          - label: Openingstijden
            name: opening_hours
            widget: list
            label_singular: Dag
            summary: "{{fields.day}}"
            required: false
            default: []

            fields:

              - label: Dag
                name: day
                widget: string

              - label: Tijden
                name: hours
                widget: string


          - label: Aanvullende informatie
            name: additional_information
            widget: text
            required: false
