# ==========================================
# KOLLER & TABOR INSTALLATIETECHNIEK
# SVELTIA CMS CONFIGURATIE
# ==========================================


# ==========================================
# GITHUB & INLOGGEN
# ==========================================

backend:
  name: github
  repo: timdekruyf07-dotcom/Kollartabor
  branch: main
  auth_methods:
    - token


# ==========================================
# TAAL
# ==========================================

locale: nl


# ==========================================
# AFBEELDINGEN
# ==========================================

media_folder: "images/uploads"
public_folder: "images/uploads"


# ==========================================
# BEHEERONDERDELEN
# ==========================================

collections:


  # ========================================
  # PROJECTEN
  # ========================================

  - name: projecten
    label: Projecten

    files:

      - name: projectenpagina
        label: Projecten beheren
        file: content/projecten.json
        format: json

        fields:

          - label: Introductietekst bovenaan
            name: introduction
            widget: text
            hint: "Deze tekst verschijnt bovenaan de projectenpagina."

          - label: Projecten
            name: projects
            widget: list
            label_singular: Project
            summary: "{{fields.title}}"
            required: false
            default: []
            hint: "Voeg projecten toe, wijzig bestaande projecten of verwijder ze."

            fields:

              - label: Projectnaam
                name: title
                widget: string

              - label: Korte omschrijving
                name: summary
                widget: text

              - label: Uitgebreide beschrijving
                name: description
                widget: text
                required: false

              - label: Projectfoto
                name: image
                widget: image
                required: false

              - label: Beschrijving van de foto
                name: image_alt
                widget: string
                required: false

              - label: Locatie
                name: location
                widget: string
                required: false

              - label: Datum
                name: date
                widget: datetime
                type: date
                required: false

              - label: Volgorde
                name: order
                widget: number
                value_type: int
                required: false

              - label: Project zichtbaar op website
                name: published
                widget: boolean
                default: true


  # ========================================
  # ONS TEAM
  # ========================================

  - name: team
    label: Ons team

    files:

      - name: teampagina
        label: Team beheren
        file: content/team.json
        format: json

        fields:

          - label: Introductietekst bovenaan
            name: introduction
            widget: text

          - label: Titel boven de medewerkers
            name: section_title
            widget: string

          - label: Beschrijving boven de medewerkers
            name: section_description
            widget: text

          - label: Medewerkers
            name: members
            widget: list
            label_singular: Medewerker
            summary: "{{fields.name}}"
            required: false
            default: []

            fields:

              - label: Naam
                name: name
                widget: string

              - label: Functie
                name: role
                widget: string

              - label: Introductie
                name: description
                widget: text
                required: false

              - label: Profielfoto
                name: photo
                widget: image
                required: false

              - label: Beschrijving van de foto
                name: photo_alt
                widget: string
                required: false

              - label: Volgorde
                name: order
                widget: number
                value_type: int
                required: false

              - label: Medewerker zichtbaar op website
                name: published
                widget: boolean
                default: true


  # ========================================
  # TARIEVEN
  # ========================================

  - name: tarieven
    label: Tarieven

    files:

      - name: tarievenpagina
        label: Tarievenpagina beheren
        file: content/tarieven.json
        format: json

        fields:

          # ==================================
          # PAGINATITEL
          # ==================================

          - label: Bovenkant van de tarievenpagina
            name: hero
            widget: object
            collapsed: true

            fields:

              - label: Kleine tekst boven de titel
                name: eyebrow
                widget: string

              - label: Titel
                name: title
                widget: string

              - label: Tekst onder de titel
                name: introduction
                widget: text


          # ==================================
          # ALGEMENE INTRODUCTIE
          # ==================================

          - label: Eerste deel van de introductietitel
            name: intro_heading
            widget: string

          - label: Gekleurd deel van de introductietitel
            name: intro_accent
            widget: string

          - label: Uitgebreide introductietekst
            name: introduction
            widget: text
            hint: "Gebruik een lege regel om een nieuwe alinea te maken."


          # ==================================
          # UURTARIEVEN
          # ==================================

          - label: Tekst boven de uurtarieven
            name: hourly_intro
            widget: text

          - label: Arbeidstarieven
            name: hourly_rates
            widget: list
            label_singular: Arbeidstarief
            summary: "{{fields.name}}"
            required: false
            default: []

            fields:

              - label: Tariefsoort
                name: name
                widget: string

              - label: Prijs exclusief btw
                name: price_ex
                widget: string

              - label: Prijs inclusief btw
                name: price_in
                widget: string

          - label: Toelichting onder de arbeidstarieven
            name: hourly_note
            widget: text


          # ==================================
          # TOESLAGEN
          # ==================================

          - label: Toeslagen
            name: surcharges
            widget: list
            label_singular: Toeslag
            summary: "{{fields.period}}"
            required: false
            default: []

            fields:

              - label: Periode
                name: period
                widget: string

              - label: Percentage
                name: percentage
                widget: string

          - label: Toelichting onder de toeslagen
            name: surcharges_note
            widget: text


          # ==================================
          # VOORRIJKOSTEN
          # ==================================

          - label: Voorrijkosten
            name: travel
            widget: object
            collapsed: true

            fields:

              - label: Introductietekst voorrijkosten
                name: introduction
                widget: text

              - label: Binnen 25 kilometer exclusief btw
                name: within_25
                widget: string

              - label: Binnen 25 kilometer inclusief btw
                name: within_25_vat
                widget: string

              - label: Boven 25 kilometer exclusief btw
                name: beyond_25
                widget: string

              - label: Tekst bij prijs per kilometer
                name: beyond_25_note
                widget: string

              - label: Uitleg over afstand berekenen
                name: description
                widget: text

              - label: Datumvermelding bij voorrijkosten
                name: date_note
                widget: text


          # ==================================
          # UITGEBREIDE TOELICHTINGEN
          # ==================================

          - label: Introductie boven de toelichtingen
            name: explanations_intro
            widget: text

          - label: Uitgebreide toelichtingen
            name: explanations
            widget: list
            label_singular: Toelichting
            summary: "{{fields.title}}"
            required: false
            default: []

            fields:

              - label: Titel van de toelichting
                name: title
                widget: string

              - label: Hoofdtekst
                name: content
                widget: text

              - label: Opvallend informatieblok
                name: highlight
                widget: text
                required: false

              - label: Tekst onder het informatieblok
                name: after_highlight
                widget: text
                required: false

              - label: Extra tussenkop
                name: subheading
                widget: string
                required: false

              - label: Extra punten
                name: problems
                widget: list
                label_singular: Punt
                summary: "{{fields.title}}"
                required: false
                default: []

                fields:

                  - label: Titel
                    name: title
                    widget: string

                  - label: Beschrijving
                    name: description
                    widget: text


          # ==================================
          # ALGEMENE VOORWAARDEN
          # ==================================

          - label: Link naar algemene voorwaarden consumenten
            name: consumer_terms
            widget: string

          - label: Link naar algemene voorwaarden bedrijven
            name: business_terms
            widget: string
            required: false

          - label: Tekst wanneer zakelijke voorwaarden ontbreken
            name: business_terms_description
            widget: text


          # ==================================
          # CONTACTBLOK ONDERAAN
          # ==================================

          - label: Titel van het contactblok
            name: contact_heading
            widget: string

          - label: Tekst van het contactblok
            name: contact_description
            widget: text


  # ========================================
  # CONTACT
  # ========================================

  - name: contact
    label: Contact

    files:

      - name: contactpagina
        label: Contactgegevens beheren
        file: content/contact.json
        format: json

        fields:

          # ==================================
          # BOVENKANT CONTACTPAGINA
          # ==================================

          - label: Bovenkant van de contactpagina
            name: hero
            widget: object
            collapsed: true

            fields:

              - label: Kleine tekst boven de titel
                name: eyebrow
                widget: string
                hint: "Bijvoorbeeld: Neem contact op"

              - label: Grote paginatitel
                name: title
                widget: string
                hint: "Bijvoorbeeld: We helpen u verder"

              - label: Tekst onder de titel
                name: introduction
                widget: text


          # ==================================
          # CONTACTSECTIE
          # ==================================

          - label: Teksten bij de contactmogelijkheden
            name: section
            widget: object
            collapsed: true

            fields:

              - label: Kleine tekst boven de titel
                name: eyebrow
                widget: string

              - label: Titel
                name: title
                widget: string

              - label: Introductietekst
                name: introduction
                widget: text


          # ==================================
          # CONTACTGEGEVENS
          # ==================================

          - label: Telefoonnummer
            name: phone
            widget: string
            required: false
            hint: "Laat leeg als het telefoonnummer nog niet gecontroleerd is."

          - label: E-mailadres
            name: email
            widget: string
            required: false
            hint: "Laat leeg als het e-mailadres nog niet gecontroleerd is."

          - label: Straat en huisnummer
            name: address
            widget: string
            required: false

          - label: Postcode
            name: postal_code
            widget: string
            required: false

          - label: Plaats
            name: city
            widget: string
            required: false

          - label: Provincie of regio
            name: region
            widget: string
            required: false


          # ==================================
          # WEBSITE EN KAART
          # ==================================

          - label: Website
            name: website
            widget: string
            required: false
            hint: "Bijvoorbeeld: https://kollertabor.nl/"

          - label: Tekst op de websiteknop
            name: website_button_text
            widget: string
            required: false

          - label: Google Maps link
            name: maps
            widget: string
            required: false
            hint: "Plak hier eventueel de Google Maps-link."


          # ==================================
          # OPENINGSTIJDEN
          # ==================================

          - label: Openingstijden
            name: opening_hours
            widget: list
            label_singular: Dag
            summary: "{{fields.day}}"
            required: false
            default: []
            hint: "Voeg hier de openingstijden toe. Zonder ingevulde tijden verschijnt er geen openingstijdenblok."

            fields:

              - label: Dag
                name: day
                widget: string
                hint: "Bijvoorbeeld: Maandag"

              - label: Tijden
                name: hours
                widget: string
                hint: "Bijvoorbeeld: 08:00 - 17:00"


          # ==================================
          # BEDRIJFSINFORMATIE
          # ==================================

          - label: Bedrijfsnaam
            name: company_name
            widget: string

          - label: Tekst onder bedrijfsnaam
            name: company_subtitle
            widget: string

          - label: Aanvullende informatie
            name: additional_information
            widget: text
            required: false
            hint: "Bijvoorbeeld een belangrijke mededeling."


          # ==================================
          # CONTACTFORMULIER
          # ==================================

          - label: Melding over contactformulier
            name: form
            widget: object
            collapsed: true

            fields:

              - label: Titel
                name: title
                widget: string

              - label: Beschrijving
                name: description
                widget: text
                hint: "Gebruik een lege regel voor een nieuwe alinea."
