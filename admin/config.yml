# ==========================================
# KOLLER & TABOR INSTALLATIETECHNIEK
# SVELTIA CMS
# ==========================================

backend:
  name: github
  repo: timdekruyf07-dotcom/Kollartabor
  branch: main
  auth_methods:
    - token

locale: nl

media_folder: "images/uploads"
public_folder: "images/uploads"


collections:

  # ========================================
  # PROJECTEN
  # ========================================

  - name: projecten
    label: Projecten

    files:

      - name: projectenpagina
        label: Projecten beheren
        file: content/projecten.json
        format: json

        fields:

          - label: Introductietekst bovenaan
            name: introduction
            widget: text
            hint: "Deze tekst verschijnt bovenaan de projectenpagina."

          - label: Projecten
            name: projects
            widget: list
            label_singular: Project
            summary: "{{fields.title}}"
            required: false
            default: []
            hint: "Voeg projecten toe, wijzig bestaande projecten of verwijder ze. De volgorde kun je aanpassen met het veld Volgorde."

            fields:

              - label: Projectnaam
                name: title
                widget: string

              - label: Korte omschrijving
                name: summary
                widget: text

              - label: Uitgebreide beschrijving
                name: description
                widget: text
                required: false

              - label: Projectfoto
                name: image
                widget: image
                required: false
                hint: "Upload een foto van het project. Zonder foto blijft het voorbeeldvak zichtbaar."

              - label: Beschrijving van de foto
                name: image_alt
                widget: string
                required: false

              - label: Locatie
                name: location
                widget: string
                required: false

              - label: Datum
                name: date
                widget: datetime
                type: date
                required: false

              - label: Volgorde
                name: order
                widget: number
                value_type: int
                required: false

              - label: Project zichtbaar op website
                name: published
                widget: boolean
                default: true


  # ========================================
  # ONS TEAM
  # ========================================

  - name: team
    label: Ons team
    label_singular: Medewerker

    folder: content/team
    create: true

    extension: json
    format: json

    slug: "{{slug}}"

    fields:

      - label: Naam
        name: name
        widget: string

      - label: Functie
        name: role
        widget: string

      - label: Introductie
        name: description
        widget: text
        required: false

      - label: Profielfoto
        name: photo
        widget: image
        required: false

      - label: Alternatieve fototekst
        name: photo_alt
        widget: string
        required: false

      - label: Volgorde
        name: order
        widget: number
        value_type: int
        required: false

      - label: Publiceren
        name: published
        widget: boolean
        default: true


  # ========================================
  # TARIEVEN
  # ========================================

  - name: tarieven
    label: Tarieven

    files:

      - name: tarievenpagina
        label: Tarievenpagina
        file: content/tarieven.json
        format: json

        fields:

          - label: Introductietekst
            name: introduction
            widget: text

          - label: Arbeidstarieven
            name: hourly_rates
            widget: list
            label_singular: Arbeidstarief
            summary: "{{fields.name}}"
            required: false
            default: []

            fields:

              - label: Tariefsoort
                name: name
                widget: string

              - label: Exclusief btw
                name: price_ex
                widget: string

              - label: Inclusief btw
                name: price_in
                widget: string

          - label: Toeslagen
            name: surcharges
            widget: list
            label_singular: Toeslag
            summary: "{{fields.period}}"
            required: false
            default: []

            fields:

              - label: Periode
                name: period
                widget: string

              - label: Percentage
                name: percentage
                widget: string

          - label: Voorrijkosten
            name: travel
            widget: object
            collapsed: true

            fields:

              - label: Binnen 25 kilometer
                name: within_25
                widget: string

              - label: Binnen 25 kilometer inclusief btw
                name: within_25_vat
                widget: string

              - label: Boven 25 kilometer
                name: beyond_25
                widget: string

              - label: Toelichting
                name: description
                widget: text

          - label: Uitgebreide toelichting
            name: explanations
            widget: list
            label_singular: Toelichting
            summary: "{{fields.title}}"
            required: false
            default: []

            fields:

              - label: Titel
                name: title
                widget: string

              - label: Inhoud
                name: content
                widget: text

          - label: Algemene voorwaarden consumenten
            name: consumer_terms
            widget: string

          - label: Algemene voorwaarden bedrijven
            name: business_terms
            widget: string


  # ========================================
  # CONTACT
  # ========================================

  - name: contact
    label: Contact

    files:

      - name: contactpagina
        label: Contactgegevens
        file: content/contact.json
        format: json

        fields:

          - label: Introductietekst
            name: introduction
            widget: text

          - label: Telefoonnummer
            name: phone
            widget: string

          - label: E-mailadres
            name: email
            widget: string

          - label: Straat en huisnummer
            name: address
            widget: string

          - label: Postcode
            name: postal_code
            widget: string

          - label: Plaats
            name: city
            widget: string

          - label: Website
            name: website
            widget: string
            required: false

          - label: Google Maps link
            name: maps
            widget: string
            required: false

          - label: Openingstijden
            name: opening_hours
            widget: list
            label_singular: Dag
            summary: "{{fields.day}}"
            required: false
            default: []

            fields:

              - label: Dag
                name: day
                widget: string

              - label: Tijden
                name: hours
                widget: string

          - label: Aanvullende informatie
            name: additional_information
            widget: text
            required: false
